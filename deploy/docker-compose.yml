services:
  app:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-}
      - RATE_LIMIT_WHITELIST=${RATE_LIMIT_WHITELIST:-}
      - SANDBOX_URL=http://sandbox:5000
      - HOSTNAME=0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend
      - sandbox_net
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  sandbox:
    build:
      context: ../sandbox
    volumes:
      - ./data/an.db:/data/an.db:ro
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"
    restart: unless-stopped

  etl:
    build:
      context: ../../decrypterlassemblee-data
      dockerfile: ../decrypterlassemblee-app/deploy/etl/Dockerfile
    volumes:
      - ./data:/data
    profiles:
      - etl
    restart: "no"

  umami-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:?Variable UMAMI_DB_PASSWORD manquante}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - umami_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:?Variable UMAMI_DB_PASSWORD manquante}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET:?Variable UMAMI_APP_SECRET manquante}
    networks:
      - frontend
      - umami_net
    depends_on:
      umami-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 256M provoquait un OOM-kill silencieux (exit 0, pas de log d'erreur)
          # à la première compilation à la demande de /api/send par Next.js —
          # observé en pic à ~202M avant le crash.
          memory: 512M
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - app
      - umami
    restart: unless-stopped

networks:
  frontend:
  sandbox_net:
    internal: true
  umami_net:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  umami_db_data:
